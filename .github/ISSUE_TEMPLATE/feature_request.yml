name: Feature request
description: Propose a focused improvement to VA Dispatch.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same proposal.
          required: true
        - label: This proposal fits the project's live dispatch and ACARS scope.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what outcome is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior without assuming a particular implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: impact
    attributes:
      label: Operational and compatibility impact
      description: Consider tenant isolation, permissions, schema rollout, costs, and third-party services.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement or test this proposal.

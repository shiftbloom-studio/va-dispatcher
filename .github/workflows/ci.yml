name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: va_dispatch_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d va_dispatch_fresh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration snapshots and schema drift
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/va_dispatch_fresh
        run: pnpm db:check

      - name: Migrate a fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/va_dispatch_fresh
          MIGRATION_CONFIRM_DATABASE: va_dispatch_fresh
        run: pnpm db:migrate

      - name: Adopt an exact ledger-less PR29 schema
        run: |
          createdb va_dispatch_adopt_pr29
          psql --dbname va_dispatch_adopt_pr29 --set ON_ERROR_STOP=1 --file apps/api/drizzle/adoption/pr29_schema.sql
          psql --dbname va_dispatch_adopt_pr29 --tuples-only --no-align --file apps/api/drizzle/adoption/schema_signature.sql > /tmp/pr29-before-adoption.txt
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_adopt_pr29 \
            MIGRATION_CONFIRM_DATABASE=va_dispatch_adopt_pr29 \
            ADOPT_PR29_BASELINE=I_HAVE_A_VERIFIED_BACKUP \
            pnpm db:adopt:pr29
          psql --dbname va_dispatch_adopt_pr29 --set ON_ERROR_STOP=1 --file apps/api/drizzle/test-fixtures/pr29-upgrade-data.sql
          psql --dbname va_dispatch_adopt_pr29 --tuples-only --no-align --file apps/api/drizzle/adoption/schema_signature.sql > /tmp/pr29-after-adoption.txt
          diff --unified /tmp/pr29-before-adoption.txt /tmp/pr29-after-adoption.txt
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_adopt_pr29 \
            MIGRATION_CONFIRM_DATABASE=va_dispatch_adopt_pr29 \
            pnpm db:migrate
          test "$(psql --dbname va_dispatch_adopt_pr29 --tuples-only --no-align --command "SELECT (SELECT revision FROM simbrief_dispatches WHERE id = '31000000-0000-4000-8000-000000000041'), (SELECT revision FROM simbrief_dispatches WHERE id = '31000000-0000-4000-8000-000000000042'), (SELECT delivery_status FROM acars_messages WHERE id = '31000000-0000-4000-8000-000000000051'), (SELECT revision FROM simbrief_flight_heads WHERE flight_id = '31000000-0000-4000-8000-000000000021')")" = "1|2|accepted|2"

      - name: Upgrade post-PR14 and pre-PR14 released schemas
        run: |
          createdb va_dispatch_upgrade_post
          psql --dbname va_dispatch_upgrade_post --set ON_ERROR_STOP=1 --file apps/api/drizzle/adoption/post_pr14_schema.sql
          psql --dbname va_dispatch_upgrade_post --set ON_ERROR_STOP=1 --command "INSERT INTO tenants (slug, name, clerk_org_id) VALUES ('upgrade-post', 'Upgrade Post', 'org_upgrade_post')"
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_upgrade_post \
            MIGRATION_CONFIRM_DATABASE=va_dispatch_upgrade_post \
            ADOPT_PR29_BASELINE=I_HAVE_A_VERIFIED_BACKUP \
            pnpm db:adopt:pr29
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_upgrade_post \
            MIGRATION_CONFIRM_DATABASE=va_dispatch_upgrade_post \
            pnpm db:migrate

          createdb va_dispatch_upgrade_pre
          psql --dbname va_dispatch_upgrade_pre --set ON_ERROR_STOP=1 --file apps/api/drizzle/adoption/pre_pr14_schema.sql
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_upgrade_pre \
            MIGRATION_CONFIRM_DATABASE=va_dispatch_upgrade_pre \
            ADOPT_PR29_BASELINE=I_HAVE_A_VERIFIED_BACKUP \
            pnpm db:adopt:pr29
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_upgrade_pre \
            MIGRATION_CONFIRM_DATABASE=va_dispatch_upgrade_pre \
            pnpm db:migrate

      - name: Verify all adoption paths match the fresh catalog and ledger
        run: |
          for database in va_dispatch_fresh va_dispatch_adopt_pr29 va_dispatch_upgrade_post va_dispatch_upgrade_pre; do
            psql --dbname "$database" --set ON_ERROR_STOP=1 --file apps/api/drizzle/verify_current_schema.sql
            psql --dbname "$database" --tuples-only --no-align --file apps/api/drizzle/adoption/schema_signature.sql > "/tmp/$database-schema.txt"
            diff --unified /tmp/va_dispatch_fresh-schema.txt "/tmp/$database-schema.txt"
          done

      - name: Reject drift in every released ledger-less source shape
        run: |
          createdb va_dispatch_drift_pre
          psql --dbname va_dispatch_drift_pre --set ON_ERROR_STOP=1 --file apps/api/drizzle/adoption/pre_pr14_schema.sql
          psql --dbname va_dispatch_drift_pre --set ON_ERROR_STOP=1 --command 'DROP INDEX memberships_tenant_idx'
          if DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_drift_pre MIGRATION_CONFIRM_DATABASE=va_dispatch_drift_pre ADOPT_PR29_BASELINE=I_HAVE_A_VERIFIED_BACKUP pnpm db:adopt:pr29; then exit 1; fi
          test "$(psql --dbname va_dispatch_drift_pre --tuples-only --no-align --command "SELECT to_regclass('public.simbrief_dispatches') IS NULL")" = "t"
          test "$(psql --dbname va_dispatch_drift_pre --tuples-only --no-align --command "SELECT to_regclass('drizzle.__drizzle_migrations') IS NULL")" = "t"

          createdb va_dispatch_drift_post
          psql --dbname va_dispatch_drift_post --set ON_ERROR_STOP=1 --file apps/api/drizzle/adoption/post_pr14_schema.sql
          psql --dbname va_dispatch_drift_post --set ON_ERROR_STOP=1 --command 'DROP INDEX memberships_tenant_idx'
          if DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_drift_post MIGRATION_CONFIRM_DATABASE=va_dispatch_drift_post ADOPT_PR29_BASELINE=I_HAVE_A_VERIFIED_BACKUP pnpm db:adopt:pr29; then exit 1; fi
          test "$(psql --dbname va_dispatch_drift_post --tuples-only --no-align --command "SELECT to_regclass('public.dispatch_releases') IS NULL")" = "t"
          test "$(psql --dbname va_dispatch_drift_post --tuples-only --no-align --command "SELECT to_regclass('drizzle.__drizzle_migrations') IS NULL")" = "t"

          createdb va_dispatch_drift_pr29
          psql --dbname va_dispatch_drift_pr29 --set ON_ERROR_STOP=1 --file apps/api/drizzle/adoption/pr29_schema.sql
          psql --dbname va_dispatch_drift_pr29 --set ON_ERROR_STOP=1 --command 'DROP INDEX memberships_tenant_idx'
          psql --dbname va_dispatch_drift_pr29 --tuples-only --no-align --file apps/api/drizzle/adoption/schema_signature.sql > /tmp/drift-pr29-before.txt
          if DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_drift_pr29 MIGRATION_CONFIRM_DATABASE=va_dispatch_drift_pr29 ADOPT_PR29_BASELINE=I_HAVE_A_VERIFIED_BACKUP pnpm db:adopt:pr29; then exit 1; fi
          psql --dbname va_dispatch_drift_pr29 --tuples-only --no-align --file apps/api/drizzle/adoption/schema_signature.sql > /tmp/drift-pr29-after.txt
          diff --unified /tmp/drift-pr29-before.txt /tmp/drift-pr29-after.txt
          test "$(psql --dbname va_dispatch_drift_pr29 --tuples-only --no-align --command "SELECT to_regclass('drizzle.__drizzle_migrations') IS NULL")" = "t"

      - name: Prove failed adoption rolls back DDL and ledger
        run: |
          createdb va_dispatch_adoption_rollback
          psql --dbname va_dispatch_adoption_rollback --set ON_ERROR_STOP=1 --file apps/api/drizzle/adoption/post_pr14_schema.sql
          if DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_adoption_rollback \
            MIGRATION_CONFIRM_DATABASE=va_dispatch_adoption_rollback \
            ADOPT_PR29_BASELINE=I_HAVE_A_VERIFIED_BACKUP \
            MIGRATION_TEST_MODE=true \
            ADOPTION_TEST_FAIL_AFTER_UPGRADE=true \
            pnpm db:adopt:pr29; then
            echo "Intentional adoption failure unexpectedly succeeded"
            exit 1
          fi
          test "$(psql --dbname va_dispatch_adoption_rollback --tuples-only --no-align --command "SELECT to_regclass('public.dispatch_releases') IS NULL")" = "t"
          test "$(psql --dbname va_dispatch_adoption_rollback --tuples-only --no-align --command "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='tenants' AND column_name='brand_seed_color')")" = "f"
          test "$(psql --dbname va_dispatch_adoption_rollback --tuples-only --no-align --command "SELECT to_regclass('drizzle.__drizzle_migrations') IS NULL")" = "t"

      - name: Prove failed migrations roll back
        run: |
          createdb va_dispatch_rollback
          if DATABASE_URL=postgresql://postgres:postgres@localhost:5432/va_dispatch_rollback \
            MIGRATION_CONFIRM_DATABASE=va_dispatch_rollback \
            MIGRATION_TEST_MODE=true \
            MIGRATIONS_FOLDER=drizzle/test-fixtures/transaction-rollback \
            pnpm db:migrate; then
            echo "Intentional migration failure unexpectedly succeeded"
            exit 1
          fi
          test "$(psql --dbname va_dispatch_rollback --tuples-only --no-align --command "SELECT to_regclass('public.migration_partial_execution_probe') IS NULL")" = "t"
          test "$(psql --dbname va_dispatch_rollback --tuples-only --no-align --command "SELECT count(*) FROM drizzle.__drizzle_migrations")" = "0"

      - name: Verify administrative and privacy PostgreSQL invariants
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/va_dispatch_fresh
          ADMIN_TEST_CONFIRM_DATABASE: va_dispatch_fresh
          PRIVACY_TEST_CONFIRM_DATABASE: va_dispatch_fresh
        run: pnpm --filter @va-dispatch/api test:postgres

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports-node-24.15.0
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @va-dispatch/web exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm --filter @va-dispatch/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-node-24.15.0
          path: apps/web/playwright-report
          retention-days: 7

  integrated-e2e:
    name: Integrated web, API, and PostgreSQL E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: va_dispatch_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d va_dispatch_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the isolated E2E database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/va_dispatch_e2e
          MIGRATION_CONFIRM_DATABASE: va_dispatch_e2e
        run: pnpm db:migrate

      - name: Install Playwright Chromium
        run: pnpm --filter @va-dispatch/web exec playwright install --with-deps chromium

      - name: Run integrated pilot and dispatcher journeys
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/va_dispatch_e2e
          E2E_CONFIRM_DATABASE: va_dispatch_e2e
        run: pnpm test:e2e:integrated

      - name: Upload failed integrated E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integrated-e2e-failures-node-24.15.0
          path: apps/web/test-results/integrated
          if-no-files-found: ignore
          retention-days: 7

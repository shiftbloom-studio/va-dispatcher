name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

      # Account artifact quota must not skip the build and browser steps.
      - name: Upload coverage reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports-node-26
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: warn
          retention-days: 3

      - name: Build
        run: pnpm build

      - name: Bundle the API Worker
        run: pnpm --filter @va-dispatch/api exec wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Install Playwright Chromium
        run: pnpm --filter @va-dispatch/web exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm --filter @va-dispatch/web test:e2e

      - name: Upload Playwright report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-node-26
          path: apps/web/playwright-report
          retention-days: 7

  integrated-e2e:
    name: Integrated web, API, and local D1 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @va-dispatch/web exec playwright install --with-deps chromium

      - name: Run integrated pilot and dispatcher journeys
        run: pnpm test:e2e:integrated

      - name: Upload failed integrated E2E artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrated-e2e-failures-node-26
          path: apps/web/test-results/integrated
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service_ports:
    name: Choose PostgreSQL host ports
    runs-on:
      group: Default
      labels: [self-hosted, linux, x64]
    timeout-minutes: 2
    outputs:
      contracts: ${{ steps.ports.outputs.contracts }}
      e2e: ${{ steps.ports.outputs.e2e }}
    steps:
      - name: Derive non-overlapping host ports from the run id
        id: ports
        shell: bash
        run: |
          set -euo pipefail
          # Separate 20000-port windows so concurrent runs can share one Docker daemon.
          slot=$(( GITHUB_RUN_ID % 20000 ))
          echo "contracts=$((20000 + slot))" >> "${GITHUB_OUTPUT}"
          echo "e2e=$((40000 + slot))" >> "${GITHUB_OUTPUT}"

  postgres-contracts:
    name: Fresh schema and PostgreSQL contracts
    needs: service_ports
    runs-on:
      group: Default
      labels: [self-hosted, linux, x64]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: va_dispatch_fresh
        ports:
          - ${{ format('{0}:5432', needs.service_ports.outputs.contracts) }}
        options: >-
          --health-cmd "pg_isready -U postgres -d va_dispatch_fresh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPORT: ${{ needs.service_ports.outputs.contracts }}
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Test PostgreSQL host resolver
        run: node --test .github/scripts/resolve-service-host.test.mjs

      - name: Resolve PostgreSQL host
        id: postgres
        run: |
          set -euo pipefail
          host="$(node .github/scripts/resolve-service-host.mjs "${PGPORT}")"
          echo "host=${host}" >> "${GITHUB_OUTPUT}"
          echo "PGHOST=${host}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push the canonical schema to a fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgres@${{ steps.postgres.outputs.host }}:${{ env.PGPORT }}/va_dispatch_fresh
        run: pnpm db:push

      - name: Verify PostgreSQL invariants
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@${{ steps.postgres.outputs.host }}:${{ env.PGPORT }}/va_dispatch_fresh
          TEST_CONFIRM_DATABASE: va_dispatch_fresh
        run: pnpm --filter @va-dispatch/api test:postgres

  validate:
    runs-on:
      group: Default
      labels: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

      # Account artifact quota must not skip the build and browser steps.
      - name: Upload coverage reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports-node-24.15.0
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: warn
          retention-days: 3

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @va-dispatch/web exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm --filter @va-dispatch/web test:e2e

      - name: Upload Playwright report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-node-24.15.0
          path: apps/web/playwright-report
          retention-days: 7

  integrated-e2e:
    name: Integrated web, API, and PostgreSQL E2E
    needs: service_ports
    runs-on:
      group: Default
      labels: [self-hosted, linux, x64]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: va_dispatch_e2e
        ports:
          - ${{ format('{0}:5432', needs.service_ports.outputs.e2e) }}
        options: >-
          --health-cmd "pg_isready -U postgres -d va_dispatch_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPORT: ${{ needs.service_ports.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Resolve PostgreSQL host
        id: postgres
        run: |
          set -euo pipefail
          host="$(node .github/scripts/resolve-service-host.mjs "${PGPORT}")"
          echo "host=${host}" >> "${GITHUB_OUTPUT}"
          echo "PGHOST=${host}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push the canonical schema to the isolated E2E database
        env:
          DATABASE_URL: postgresql://postgres:postgres@${{ steps.postgres.outputs.host }}:${{ env.PGPORT }}/va_dispatch_e2e
        run: pnpm db:push

      - name: Install Playwright Chromium
        run: pnpm --filter @va-dispatch/web exec playwright install --with-deps chromium

      - name: Run integrated pilot and dispatcher journeys
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@${{ steps.postgres.outputs.host }}:${{ env.PGPORT }}/va_dispatch_e2e
          E2E_CONFIRM_DATABASE: va_dispatch_e2e
        run: pnpm test:e2e:integrated

      - name: Upload failed integrated E2E artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integrated-e2e-failures-node-24.15.0
          path: apps/web/test-results/integrated
          if-no-files-found: ignore
          retention-days: 7

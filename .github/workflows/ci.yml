name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.15.0, 26.7.0]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports-node-${{ matrix.node-version }}
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        if: matrix.node-version == '26.7.0'
        run: pnpm --filter @va-dispatch/web exec playwright install --with-deps chromium

      - name: Browser smoke tests
        if: matrix.node-version == '26.7.0'
        run: pnpm --filter @va-dispatch/web test:e2e

      - name: Upload Playwright report
        if: failure() && matrix.node-version == '26.7.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: apps/web/playwright-report
          retention-days: 7
